<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Appsatile, A Message</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root{
    --paper:#f1f6fe;
    --ink:#122033;
    --muted:#5c6b80;
    --line:#cfdcf0;
    --brand:#0071F3;
    --brand-deep:#0559b8;
    --orb-1:#5fa8ff;
    --orb-2:#0071F3;
    --orb-3:#0546a3;
    --accent:#0071F3;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Inter","Inter var",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
    padding:clamp(28px,6vw,72px) 24px 92px;
    position:relative;
    overflow-x:hidden;
  }
  /* soft blue vignette */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
      radial-gradient(120% 80% at 50% -10%, rgba(0,113,243,0.12), transparent 60%),
      radial-gradient(100% 60% at 50% 120%, rgba(5,89,184,0.08), transparent 55%);
    pointer-events:none;
    z-index:0;
  }

  /* logo top-left */
  .brand{
    position:absolute;
    top:clamp(22px,4vw,40px);
    left:clamp(22px,4vw,44px);
    width:clamp(124px,20vw,164px);
    z-index:3;
  }
  .brand svg{display:block;width:100%;height:auto;}

  main{
    position:relative;
    z-index:1;
    width:100%;
    max-width:660px;
    margin:auto 0;
    text-align:center;
  }

  /* animated orb */
  .sun-wrap{
    display:flex;
    justify-content:center;
    margin-bottom:clamp(28px,5vw,44px);
  }
  .sun{
    width:clamp(96px,22vw,140px);
    height:clamp(96px,22vw,140px);
    border-radius:50%;
    background:radial-gradient(circle at 50% 45%, var(--orb-1), var(--orb-2) 55%, var(--orb-3));
    box-shadow:0 0 0 0 rgba(0,113,243,0.35);
    animation:pulse 5.5s ease-in-out infinite;
    position:relative;
  }
  .sun::after{
    content:"";
    position:absolute;
    left:-30%;
    right:-30%;
    bottom:-8%;
    height:2px;
    background:linear-gradient(90deg,transparent,var(--line),transparent);
  }
  @keyframes pulse{
    0%,100%{box-shadow:0 0 60px 6px rgba(0,113,243,0.24);transform:translateY(0);}
    50%{box-shadow:0 0 90px 14px rgba(5,89,184,0.22);transform:translateY(3px);}
  }

  .eyebrow{
    font-size:12px;
    font-weight:600;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:22px;
  }
  h1{
    font-size:clamp(34px,7vw,58px);
    font-weight:700;
    line-height:1.08;
    letter-spacing:-0.02em;
    margin-bottom:26px;
  }
  h1 .name{font-style:normal;}
  .lede{
    font-size:clamp(17px,2.4vw,20px);
    line-height:1.65;
    color:var(--muted);
    max-width:52ch;
    margin:0 auto 20px;
  }
  .lede.tight{margin-bottom:34px;}
  .rule{
    width:64px;
    height:1px;
    background:var(--line);
    margin:34px auto;
  }
  .thanks{
    font-size:clamp(18px,2.6vw,22px);
    line-height:1.6;
    font-style:normal;
    margin-bottom:0;
  }

  /* staggered load reveal */
  .reveal{opacity:0;transform:translateY(14px);animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards;}
  .d1{animation-delay:.05s;}
  .d2{animation-delay:.20s;}
  .d3{animation-delay:.35s;}
  .d4{animation-delay:.50s;}
  .d5{animation-delay:.65s;}
  .d6{animation-delay:.80s;}
  @keyframes rise{to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){
    .reveal{animation:none;opacity:1;transform:none;}
    .sun{animation:none;}
  }

  @media print{
    body{padding:40px;}
    .sun{animation:none;}
    .reveal{opacity:1;transform:none;animation:none;}
  }
</style>
</head>
